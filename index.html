<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bayna Yadayk Deel 2 — Examen-Sprint</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a212b; --card2:#222c38; --ink:#eef2f6; --mut:#9fb0c0;
    --acc:#39b88a; --acc2:#2d8f6b; --gold:#e0a93e; --red:#e06a5a; --line:#2c3744; --blue:#5aa9e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;padding-bottom:78px}
  .ar{font-family:"Geeza Pro","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;direction:rtl}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#121922,#0f1419);border-bottom:1px solid var(--line);padding:12px 16px}
  header .hwrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
  header h1{margin:0;font-size:17px;font-weight:700}
  header .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .txtsize{display:flex;gap:6px;flex-shrink:0}
  .txtsize button{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:16px;padding:7px 12px;border-radius:9px;min-width:42px}
  .txtsize button:active{transform:translateY(1px)}
  main{padding:16px;max-width:760px;margin:0 auto}
  h2{font-size:18px;margin:4px 0 12px}
  h3{font-size:15px;margin:18px 0 8px;color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
  .mut{color:var(--mut)}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;margin:0 6px 6px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
  .btn{background:var(--acc);color:#06231a;font-weight:700;padding:11px 16px;font-size:14px}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .btn.gold{background:var(--gold);color:#2a1d04}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#121922;border-top:1px solid var(--line);display:flex;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 8px}
  nav button{background:none;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;flex:0 0 auto;min-width:54px}
  nav button .ic{font-size:19px}
  nav button.on{color:var(--acc)}
  .hidden{display:none!important}
  /* plan */
  .plan-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .plan-item:last-child{border-bottom:none}
  .plan-tijd{min-width:88px;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:13px}
  .plan-blok{font-weight:700;font-size:14px}
  .plan-wat{color:var(--mut);font-size:13px;margin-top:2px}
  /* flashcard */
  .fc{perspective:1200px;margin:10px 0}
  .fc-inner{position:relative;min-height:200px;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card2);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
  .fc-back{transform:rotateY(180deg)}
  .fc-ar{font-size:40px;font-weight:700}
  .fc-tr{color:var(--blue);font-size:15px;margin-top:8px}
  .fc-nl{font-size:22px;font-weight:700}
  .fc-ex{margin-top:14px;font-size:17px}
  .fc-exnl{color:var(--mut);font-size:13px;margin-top:4px}
  .counter{color:var(--mut);font-size:13px;text-align:center;margin:6px 0}
  .progress{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:4px 0 10px}
  .progress > i{display:block;height:100%;background:var(--acc);width:0}
  /* quiz */
  .opt{display:block;width:100%;text-align:right;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:14px;border-radius:12px;margin:8px 0;font-size:23px}
  .opt.good{background:#16432f;border-color:var(--acc)}
  .opt.bad{background:#451f1a;border-color:var(--red)}
  input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:22px}
  textarea{width:100%;min-height:120px;background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:20px;line-height:1.9}
  .verdict{font-weight:700;margin-top:10px}
  .ok{color:var(--acc)} .no{color:var(--red)}
  .model-ar{font-size:24px;line-height:2;background:#142b22;border:1px solid var(--acc2);border-radius:12px;padding:14px;margin-top:8px}
  .model-nl{color:var(--mut);font-size:14px;margin-top:8px}
  .grid2{display:grid;grid-template-columns:1fr;gap:8px}
  table{width:100%;border-collapse:collapse}
  td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
  td.a{font-size:24px;white-space:nowrap}
  .chip{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:inline-block;margin:3px 4px 3px 0}
  .selUnit{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .selUnit button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:9px 12px;font-size:13px;border-radius:999px}
  .selUnit button.on{background:var(--acc);color:#06231a;font-weight:700}
  .tip{font-size:13px;color:var(--mut);background:var(--card2);border-left:3px solid var(--gold);border-radius:8px;padding:10px;margin:8px 0}
  .good-ex{color:var(--acc)} .bad-ex{color:var(--red);text-decoration:line-through}
  .spk{background:none;border:none;color:var(--blue);font-size:17px;cursor:pointer;padding:0 4px;vertical-align:middle;line-height:1}
  .spk:active{transform:scale(.9)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1>🕌 Bayna Yadayk — Deel 2 · Examen-Sprint</h1>
      <div class="sub">Boek 1 · schrijftoets · interactieve leer-app</div>
    </div>
    <div class="txtsize">
      <button onclick="bumpScale(-1)" aria-label="tekst kleiner">A−</button>
      <button onclick="bumpScale(1)" aria-label="tekst groter">A+</button>
    </div>
  </div>
</header>
<main id="view"></main>

<nav>
  <button data-tab="vandaag" class="on"><span class="ic">📅</span>Vandaag</button>
  <button data-tab="plan"><span class="ic">🏁</span>Plan</button>
  <button data-tab="lesplan"><span class="ic">📘</span>Les</button>
  <button data-tab="diag"><span class="ic">🩺</span>Diagnose</button>
  <button data-tab="woorden"><span class="ic">📚</span>Woorden</button>
  <button data-tab="motor"><span class="ic">✍️</span>Schrijf</button>
  <button data-tab="grammatica"><span class="ic">📐</span>Gram</button>
  <button data-tab="vervoeg"><span class="ic">🔁</span>Vervoeg</button>
  <button data-tab="spelling"><span class="ic">🔤</span>Spelling</button>
  <button data-tab="quiz"><span class="ic">🧠</span>Quiz</button>
  <button data-tab="train"><span class="ic">🖊️</span>Train</button>
  <button data-tab="voortgang"><span class="ic">📊</span>Voortgang</button>
</nav>

<script>
const DATA = {"plan": [{"tijd": "0:00 – 0:10", "blok": "Diagnose Deel 1", "wat": "Doe de Deel 1-diagnosetest (20 woorden) — snel, om te zien welke thema's zwak zijn."}, {"tijd": "0:10 – 0:25", "blok": "Schrijfmotor + Spelling lezen", "wat": "Lees de tabs Schrijfmotor en Spelling 1x door. Zinspatronen + 8 spellingvallen = de breedste puntenwinst."}, {"tijd": "0:25 – 0:55", "blok": "Verleden tijd vervoegen", "wat": "Tab Vervoeg: leer de 13 achtervoegsels, doe 'Oefenen (typen)' tot 80%+ en 'Herkennen' voor de overhoring. Bekijk ook de bonus toekomende tijd (سـ)."}, {"tijd": "0:55 – 2:10", "blok": "Grammatica-stencils (9 onderwerpen)", "wat": "Tab Gram: per onderwerp theorie lezen + mini-quiz doen (~8 min elk). Dit is exact de stof van je docent: woordsoorten, naamwoordzin, nkr/معرفة, zon/maanletters, tanwin, aanwijswoorden, vraagwoorden, mv, tijd/plaats."}, {"tijd": "2:10 – 2:20", "blok": "Pauze", "wat": "Sta op, drink water, loop. Je brein zet kennis vast tijdens rust."}, {"tijd": "2:20 – 3:05", "blok": "Woorden Deel 2", "wat": "Tab Woorden: per thema kaarten flippen + quiz. Focus op de zwakke thema's uit je diagnose. Markeer foute woorden als 'nog leren'."}, {"tijd": "3:05 – 3:45", "blok": "Schrijftraining", "wat": "Het echte examenwerk. Tab Train: schrijf ZELF 5-6 zinnen met de gegeven woorden, vergelijk met het modelverhaal. Gebruik verleden tijd + tijd/plaats-bijwoorden. Let op spelling (ة، hamza، tanwin)."}, {"tijd": "3:45 – 4:00", "blok": "Laatste check", "wat": "Herhaal foute woorden (quiz 'alleen nog-leren') en lees je 8 modelverhalen nog 1x. Ken van elk thema 1 openingszin + 3 kernwoorden. Klaar."}], "schrijfmotor": [{"titel": "Open je verhaal (plaatje beschrijven)", "rijen": [["هَذِهِ صُورَةٌ عَنْ...", "hādhihi ṣūratun ʿan...", "Dit is een foto over..."], ["فِي الصُّورَةِ...", "fī aṣ-ṣūrah...", "Op de foto..."], ["أَرَى فِي الصُّورَةِ...", "arā fī aṣ-ṣūrah...", "Ik zie op de foto..."], ["هَذَا / هَذِهِ ...", "hādhā / hādhihi", "Dit is een ... (m / v)"]]}, {"titel": "Tijd & volgorde (laat een verhaal lopen)", "rijen": [["فِي الصَّبَاحِ / فِي المَسَاءِ", "fī aṣ-ṣabāḥ / fī al-masāʾ", "'s ochtends / 's avonds"], ["يَوْمَ الجُمُعَةِ", "yawma al-jumuʿah", "op vrijdag"], ["أَوَّلًا ... ثُمَّ ... بَعْدَ ذَلِكَ ... أَخِيرًا", "awwalan... thumma... baʿda dhālik... akhīran", "eerst... daarna... vervolgens... ten slotte"], ["كُلَّ يَوْمٍ", "kulla yawm", "elke dag"]]}, {"titel": "Verleden tijd (vertel wat gebeurde)", "rijen": [["ذَهَبْتُ إِلَى...", "dhahabtu ilā...", "ik ging naar..."], ["رَأَيْتُ...", "raʾaytu...", "ik zag..."], ["اِشْتَرَيْتُ / أَكَلْتُ / رَكِبْتُ", "ishtaraytu / akaltu / rakibtu", "ik kocht / at / stapte in"], ["زُرْتُ... / سَافَرْتُ إِلَى...", "zurtu... / sāfartu ilā...", "ik bezocht... / ik reisde naar..."]]}, {"titel": "Willen, houden van, omdat (geef reden/gevoel)", "rijen": [["أُرِيدُ أَنْ + werkwoord", "urīdu an...", "ik wil ... (bv. أُرِيدُ أَنْ أَشْتَرِيَ = ik wil kopen)"], ["أُحِبُّ + zelfstandig naamwoord", "uḥibbu...", "ik hou van..."], ["لِأَنَّ ...", "li-anna...", "omdat..."], ["لِ + werkwoord", "li-...", "om te ... (bv. ذَهَبْتُ لِأَشْتَرِيَ = ik ging om te kopen)"]]}, {"titel": "Beschrijven (naamwoordzin & كان)", "rijen": [["الجَوُّ حَارٌّ. / البَيْتُ كَبِيرٌ.", "al-jawwu ḥārr / al-baytu kabīr", "Het weer is warm. / Het huis is groot. (geen 'is'-werkwoord!)"], ["هَذَا قَمِيصٌ جَمِيلٌ.", "hādhā qamīṣun jamīl", "Dit is een mooi overhemd."], ["كَانَ الجَوُّ بَارِدًا.", "kāna al-jawwu bāridan", "Het weer wás koud. (na كان → naṣb/tanwin -an)"], ["عِنْدِي... / مَعِي...", "ʿindī... / maʿī...", "ik heb... / ik heb bij me..."]]}, {"titel": "Sluit je verhaal af", "rijen": [["كَانَ يَوْمًا جَمِيلًا.", "kāna yawman jamīlan", "Het was een mooie dag."], ["كَانَتْ رِحْلَةً مُمْتِعَةً.", "kānat riḥlatan mumtiʿah", "Het was een leuke reis."], ["اِسْتَمْتَعْتُ كَثِيرًا.", "istamtaʿtu kathīran", "Ik heb erg genoten."], ["الحَمْدُ لِلَّهِ.", "al-ḥamdu lillāh", "Alle lof zij Allah."]]}], "spelling": [{"titel": "ة (taa marbuta) of ه?", "regel": "ة heeft twee puntjes en hoort bij vrouwelijke woorden. Ze staat ALLEEN aan het eind en je hoort een korte -a. Schrijf daar nooit een gewone ه (h).", "goed": "مَدْرَسَة، سَيَّارَة، رِحْلَة", "fout": "مدرسه، سياره"}, {"titel": "De hamza: أ / إ / آ", "regel": "De hamza zit vaak op een alif. أ = hamza erbóven, klinkt als a of u (أَكَلَ، أُرِيد). إ = hamza erónder, klinkt als i (إِلَى). آ = lange aa (آمَنَ). Vergeet de hamza niet te schrijven.", "goed": "أَب، إِسْلَام، أُرِيد", "fout": "اب، اسلام"}, {"titel": "ى of ي aan het eind?", "regel": "Een paar woorden eindigen op ى: dat lijkt op de ي, maar heeft GEEN puntjes en klinkt als een lange -aa. Onthoud vooral: إلى، على، مستشفى.", "goed": "إِلَى، عَلَى، مُسْتَشْفَى", "fout": "الي، علي، مستشفي"}, {"titel": "De -an-klank schrijven: ـًا", "regel": "Hoor je -an aan het eind (bv. bij een lijdend voorwerp of na كان)? Schrijf dan ـً, meestal met een losse alif erachter: قَمِيصًا. De 'n' schrijf je NIET als ن. Géén losse alif na ة، ى، أ، اء.", "goed": "اِشْتَرَيْتُ قَمِيصًا، كَانَ بَارِدًا", "fout": "اشتريت قميص (de -an vergeten)"}, {"titel": "الـ vóór zon- of maanletter", "regel": "Je schrijft الـ altijd hetzelfde, maar de UITSPRAAK verschilt. Vóór een zonletter (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) hoor je de ل niet en verdubbel je de volgende letter: الشَّمْس = ash-shams. Vóór een maanletter spreek je الـ gewoon uit: القَمَر = al-qamar.", "goed": "الشَّمْس (ash-shams)، النَّاس (an-nās)", "fout": "‘al-shams’ zeggen (moet zijn: ash-shams)"}, {"titel": "Begin-alif zonder hamza (اسم، ابن)", "regel": "Woorden als اسم، ابن، اشترى beginnen met een alif ZONDER hamza-teken. Aan het begin zeg je 'i' (ism), maar je schrijft géén hamza eronder.", "goed": "اِسْمِي أَحْمَد، اِشْتَرَيْت", "fout": "إسمي (hamza eronder is hier fout)"}, {"titel": "Bezit (idafa): 1e woord zonder tanwin/الـ", "regel": "Bij 'de … van de …' krijgt het EERSTE woord geen tanwin én geen الـ. Het tweede woord heeft vaak wel الـ.", "goed": "بَابُ البَيْتِ (de deur van het huis)، حَقِيبَةُ السَّفَرِ (de reiskoffer)", "fout": "بابٌ البيتِ (tanwin op het eerste woord is fout)"}, {"titel": "Vrouwelijk: werkwoord + ـتْ, bn + ة", "regel": "Is het onderwerp vrouwelijk? Dan eindigt het werkwoord (verleden tijd) op ـتْ en het bijvoeglijk naamwoord op ة. Laat onderwerp en gezegde bij elkaar passen.", "goed": "ذَهَبَتْ فَاطِمَة، السَّيَّارَةُ جَمِيلَة", "fout": "ذهب فاطمة، السيارة جميل"}], "modellen": [{"unit": 9, "thema": "Winkelen — التَّسَوُّق", "emoji": "🛍️", "opdracht": "Schrijf een verhaaltje (5-6 zinnen) over een dag op de markt. Gebruik de woorden:", "woorden": ["السُّوق (markt)", "قَمِيص (overhemd)", "ثَمَن (prijs)", "أَبْيَض (wit)", "خَمْسُونَ (vijftig)", "البَائِع (verkoper)"], "model_ar": "ذَهَبْتُ إِلَى السُّوقِ يَوْمَ الجُمُعَةِ. أَرَدْتُ أَنْ أَشْتَرِيَ قَمِيصًا. رَأَيْتُ قَمِيصًا أَبْيَضَ وَقَمِيصًا أَحْمَرَ. سَأَلْتُ البَائِعَ: كَمْ ثَمَنُ هَذَا القَمِيصِ؟ قَالَ: خَمْسُونَ رِيَالًا. اِشْتَرَيْتُ القَمِيصَ الأَبْيَضَ. كَانَ رَخِيصًا وَجَمِيلًا.", "model_nl": "Ik ging vrijdag naar de markt. Ik wilde een overhemd kopen. Ik zag een wit en een rood overhemd. Ik vroeg de verkoper: hoeveel kost dit overhemd? Hij zei: vijftig riyal. Ik kocht het witte overhemd. Het was goedkoop en mooi."}, {"unit": 10, "thema": "Het weer — الجَوّ", "emoji": "🌤️", "opdracht": "Beschrijf het weer in de vier seizoenen. Gebruik de woorden:", "woorden": ["الجَوّ (weer)", "حَارّ (warm)", "بَارِد (koud)", "الصَّيْف (zomer)", "الشِّتَاء (winter)", "تُمْطِر (het regent)"], "model_ar": "الجَوُّ اليَوْمَ جَمِيلٌ. الشَّمْسُ مُشْرِقَةٌ وَالسَّمَاءُ زَرْقَاءُ. فِي الصَّيْفِ الجَوُّ حَارٌّ، وَفِي الشِّتَاءِ الجَوُّ بَارِدٌ وَتُمْطِرُ السَّمَاءُ. فِي الخَرِيفِ تَهُبُّ الرِّيَاحُ. أُحِبُّ الرَّبِيعَ لِأَنَّ الجَوَّ مُعْتَدِلٌ.", "model_nl": "Het weer is vandaag mooi. De zon schijnt en de lucht is blauw. In de zomer is het warm, en in de winter is het koud en regent het. In de herfst waait de wind. Ik hou van de lente omdat het weer mild is."}, {"unit": 11, "thema": "Mensen & plaatsen — النَّاس وَالأَمَاكِن", "emoji": "🏙️", "opdracht": "Beschrijf jouw stad en wie er werkt. Gebruik de woorden:", "woorden": ["مَدِينَة (stad)", "مَسْجِد (moskee)", "مُسْتَشْفَى (ziekenhuis)", "طَبِيب (dokter)", "مُعَلِّمَة (lerares)", "قَرِيب (dichtbij)"], "model_ar": "أَنَا أَسْكُنُ فِي مَدِينَةٍ كَبِيرَةٍ. فِي مَدِينَتِي مَسْجِدٌ وَمُسْتَشْفًى وَمَدْرَسَةٌ. أَبِي طَبِيبٌ يَعْمَلُ فِي المُسْتَشْفَى. أُمِّي مُعَلِّمَةٌ فِي المَدْرَسَةِ. أَذْهَبُ إِلَى السُّوقِ القَرِيبِ كُلَّ يَوْمٍ. أُحِبُّ مَدِينَتِي كَثِيرًا.", "model_nl": "Ik woon in een grote stad. In mijn stad is een moskee, een ziekenhuis en een school. Mijn vader is dokter en werkt in het ziekenhuis. Mijn moeder is lerares op de school. Ik ga elke dag naar de markt dichtbij. Ik hou veel van mijn stad."}, {"unit": 12, "thema": "Hobby's — الهِوَايَات", "emoji": "⚽", "opdracht": "Vertel over jouw hobby en die van je familie. Gebruik de woorden:", "woorden": ["هِوَايَة (hobby)", "القِرَاءَة (lezen)", "السِّبَاحَة (zwemmen)", "كُرَة القَدَم (voetbal)", "الحَدِيقَة (tuin/park)", "المُفَضَّلَة (favoriet)"], "model_ar": "هِوَايَتِي المُفَضَّلَةُ هِيَ القِرَاءَةُ. أَقْرَأُ كِتَابًا كُلَّ يَوْمٍ. أَخِي يُحِبُّ كُرَةَ القَدَمِ، وَأُخْتِي تُحِبُّ السِّبَاحَةَ. فِي العُطْلَةِ نَلْعَبُ مَعًا فِي الحَدِيقَةِ. الهِوَايَةُ مُهِمَّةٌ لِلصِّحَّةِ.", "model_nl": "Mijn favoriete hobby is lezen. Ik lees elke dag een boek. Mijn broer houdt van voetbal en mijn zus houdt van zwemmen. In de vakantie spelen we samen in het park. Een hobby is belangrijk voor de gezondheid."}, {"unit": 13, "thema": "Reizen — السَّفَر", "emoji": "✈️", "opdracht": "Beschrijf een reis die je maakte. Gebruik de woorden:", "woorden": ["سَافَرْتُ (ik reisde)", "المَطَار (luchthaven)", "الطَّائِرَة (vliegtuig)", "الحَقِيبَة (koffer)", "الرِّحْلَة (reis)", "مُمْتِعَة (leuk)"], "model_ar": "سَافَرْتُ إِلَى مِصْرَ فِي الصَّيْفِ. ذَهَبْتُ إِلَى المَطَارِ وَحَمَلْتُ حَقِيبَتِي. رَكِبْتُ الطَّائِرَةَ السَّاعَةَ التَّاسِعَةَ. كَانَتِ الرِّحْلَةُ طَوِيلَةً وَلَكِنَّهَا مُمْتِعَةٌ. زُرْتُ الأَهْرَامَ وَأَخَذْتُ صُوَرًا كَثِيرَةً.", "model_nl": "Ik reisde in de zomer naar Egypte. Ik ging naar de luchthaven en droeg mijn koffer. Ik stapte om negen uur in het vliegtuig. De reis was lang maar leuk. Ik bezocht de piramides en maakte veel foto's."}, {"unit": 14, "thema": "Hadj & Umrah — الحَجّ وَالعُمْرَة", "emoji": "🕋", "opdracht": "Beschrijf wat een pelgrim doet tijdens de Hadj. Gebruik de woorden:", "woorden": ["الحَاجّ (pelgrim)", "مَكَّة (Mekka)", "الإِحْرَام (ihram)", "الكَعْبَة (Kaaba)", "طَافَ (hij liep rond)", "عَرَفَة (Arafat)"], "model_ar": "ذَهَبَ الحَاجُّ إِلَى مَكَّةَ لِأَدَاءِ الحَجِّ. لَبِسَ الإِحْرَامَ وَطَافَ حَوْلَ الكَعْبَةِ سَبْعَ مَرَّاتٍ. ثُمَّ سَعَى بَيْنَ الصَّفَا وَالمَرْوَةِ. وَقَفَ بِعَرَفَةَ وَدَعَا اللَّهَ. الحَجُّ رُكْنٌ مِنْ أَرْكَانِ الإِسْلَامِ.", "model_nl": "De pelgrim ging naar Mekka om de Hadj te verrichten. Hij droeg de ihram en liep zeven keer rond de Kaaba. Daarna liep hij tussen Safa en Marwa. Hij stond op Arafat en smeekte tot Allah. De Hadj is een zuil van de Islam."}, {"unit": 15, "thema": "Gezondheid — الصِّحَّة", "emoji": "🩺", "opdracht": "Vertel over een bezoek aan de dokter. Gebruik de woorden:", "woorden": ["الطَّبِيب (dokter)", "مَرِيض (ziek)", "صُدَاع (hoofdpijn)", "حُمَّى (koorts)", "الدَّوَاء (medicijn)", "فَحَصَ (onderzocht)"], "model_ar": "ذَهَبْتُ إِلَى الطَّبِيبِ لِأَنِّي مَرِيضٌ. قُلْتُ لَهُ: عِنْدِي صُدَاعٌ وَحُمَّى. فَحَصَنِي الطَّبِيبُ وَقَالَ: اِشْرَبْ هَذَا الدَّوَاءَ وَنَمْ جَيِّدًا. شَكَرْتُ الطَّبِيبَ. بَعْدَ يَوْمَيْنِ شَعَرْتُ بِتَحَسُّنٍ.", "model_nl": "Ik ging naar de dokter omdat ik ziek was. Ik zei tegen hem: ik heb hoofdpijn en koorts. De dokter onderzocht me en zei: drink dit medicijn en slaap goed. Ik bedankte de dokter. Na twee dagen voelde ik me beter."}, {"unit": 16, "thema": "Vakantie & feest — العُطْلَة", "emoji": "🏖️", "opdracht": "Vertel wat je in de vakantie deed. Gebruik de woorden:", "woorden": ["العُطْلَة (vakantie)", "البَحْر (de zee)", "الشَّاطِئ (strand)", "العِيد (feest)", "زُرْنَا (wij bezochten)", "سَعِيدَة (gelukkig)"], "model_ar": "فِي العُطْلَةِ سَافَرَتْ أُسْرَتِي إِلَى البَحْرِ. سَبَحْنَا وَلَعِبْنَا عَلَى الشَّاطِئِ. فِي العِيدِ زُرْنَا الجَدَّ وَالجَدَّةَ وَأَكَلْنَا طَعَامًا لَذِيذًا. لَعِبَ الأَطْفَالُ كَثِيرًا. كَانَتْ عُطْلَةً سَعِيدَةً.", "model_nl": "In de vakantie reisde mijn familie naar de zee. We zwommen en speelden op het strand. Op het feest bezochten we opa en oma en aten we lekker eten. De kinderen speelden veel. Het was een gelukkige vakantie."}], "vervoegenRegel": {"intro": "In de verleden tijd (الماضي) blijft de stam gelijk en plak je een achtervoegsel achter het werkwoord. Leer deze 13 achtervoegsels — ze zijn voor ELK klankzuiver werkwoord hetzelfde.", "rijen": [["ik", "أَنَا", "ـْتُ", "كَتَبْتُ", "katabtu", "ik schreef"], ["jij (man)", "أَنْتَ", "ـْتَ", "كَتَبْتَ", "katabta", "jij schreef (m)"], ["jij (vrouw)", "أَنْتِ", "ـْتِ", "كَتَبْتِ", "katabti", "jij schreef (v)"], ["hij", "هُوَ", "ـَ", "كَتَبَ", "kataba", "hij schreef"], ["zij (vrouw)", "هِيَ", "ـَتْ", "كَتَبَتْ", "katabat", "zij schreef"], ["wij", "نَحْنُ", "ـْنَا", "كَتَبْنَا", "katabnā", "wij schreven"], ["jullie twee", "أَنْتُمَا", "ـْتُمَا", "كَتَبْتُمَا", "katabtumā", "jullie twee schreven"], ["jullie (m)", "أَنْتُمْ", "ـْتُمْ", "كَتَبْتُمْ", "katabtum", "jullie schreven (m)"], ["jullie (v)", "أَنْتُنَّ", "ـْتُنَّ", "كَتَبْتُنَّ", "katabtunna", "jullie schreven (v)"], ["zij twee (m)", "هُمَا", "ـَا", "كَتَبَا", "katabā", "zij twee schreven (m)"], ["zij twee (v)", "هُمَا", "ـَتَا", "كَتَبَتَا", "katabatā", "zij twee schreven (v)"], ["zij (m, mv)", "هُمْ", "ـُوا", "كَتَبُوا", "katabū", "zij schreven (m)"], ["zij (v, mv)", "هُنَّ", "ـْنَ", "كَتَبْنَ", "katabna", "zij schreven (v)"]], "tip": "Let op de spelling: هم-vorm eindigt op ـُوا met een stille alif (كَتَبُوا). هي = ـَتْ (sukun op de ت). Zwakke werkwoorden (قَالَ، نَامَ، زَارَ) vervoegen anders — die staan hier niet bij; oefen  meestal…", "opts": ["bepaald (معرفة)", "onbepaald (نكرة)"], "a": 1, "u": "Het gezegde is meestal onbepaald, vaak met tanwin (bv. كَبِيرٌ)."}, {"q": "Kies de juiste خبر: الشَّمْسُ ___ (de zon is …)", "opts": ["مُشْرِقَةٌ (schijnend)", "عِبَادَةٌ (aanbidding)"], "a": 0, "u": "الشَّمْسُ مُشْرِقَةٌ = de zon is schijnend. عبادة (aanbidding) past bij الصلاة (het gebed)."}, {"q": "Kies de juiste خبر: العِنَبُ ___ (druiven zijn …)", "opts": ["سَرِيعٌ (snel)", "لَذِيذٌ (lekker)"], "a": 1, "u": "العِنَبُ لَذِيذٌ = druiven zijn lekker. سريع (snel) past bij الحصان (het paard)."}, {"q": "Welke zin is een naamwoordzin (begint met een naamwoord)?", "opts": ["البَيْتُ كَبِيرٌ (het huis is groot)", "ذَهَبَ الوَلَدُ (de jongen ging)"], "a": 0, "u": "البيت كبير begint met het naamwoord البيت → naamwoordzin (جملة اسمية). ذهب begint met een werkwoord → werkwoordzin (جملة فعلية)."}]}, {"key": "marifa", "emoji": "🔖", "nl": "Onbepaald & bepaald", "ar": "النكرة والمعرفة", "intro": "Onbepaald (نكرة) = iets algemeens/onbekends. Bepaald (معرفة) = iets specifieks/bekends.", "theorie": [{"h": "نكرة — onbepaald", "ar": "كِتَابٌ، قَلَمٌ، وَلَدٌ", "nl": "Een (willekeurig) ding. Komt vaak met tanwin (ـٌ ـٍ ـً). Vergelijk NL 'een boek'."}, {"h": "معرفة — bepaald", "ar": "الكِتَابُ، القَلَمُ، الوَلَدُ", "nl": "Een bekend/specifiek ding. Bekendste teken: الـ. Ook bepaald: namen (مُحَمَّد), aanwijswoorden (هذا), voornaamwoorden. Vergelijk NL 'het boek'."}], "quiz": [{"q": "كِتَابٌ is…", "opts": ["نكرة", "معرفة"], "a": 0, "u": "Tanwin, geen الـ → onbepaald."}, {"q": "القَمَرُ is…", "opts": ["نكرة", "معرفة"], "a": 1, "u": "Met الـ → bepaald."}, {"q": "بِنْتٌ is…", "opts": ["نكرة", "معرفة"], "a": 0, "u": "Tanwin → onbepaald."}, {"q": "Maak معرفة van 'كِتَابٌ'", "opts": ["الكِتَابُ", "كِتَابَان"], "a": 0, "u": "Voeg الـ toe en haal de tanwin weg → الكتابُ."}, {"q": "Is een eigennaam zoals 'مُحَمَّد' bepaald?", "opts": ["Ja (معرفة)", "Nee (نكرة)"], "a": 0, "u": "Namen zijn altijd bepaald, ook zonder الـ."}, r": "كِتَاب → كِتَابًا · طَالِب → طَالِبًا", "nl": "Bij de -an-vorm schrijf je meestal een losse alif erachter. Die alif spreek je NIET uit; je zegt gewoon -an (kitāb-an)."}, {"h": "3. Uitzondering: géén losse alif", "ar": "مَدْرَسَةً · فَتًى · مَلْجَأً · مَاءً", "nl": "Geen extra alif als het woord al eindigt op ة (مدرسةً), op ى (فتىً), op أ (ملجأً) of op اء (ماءً). De tanwin komt dan direct op die letter."}], "quiz": [{"q": "Welk soort tanwin: رَجُلٌ ?", "opts": ["ضم (-un)", "كسر (-in)", "فتح (-an)"], "a": 0, "u": "ـٌ = damma-tanwin (-un)."}, {"q": "Welk soort tanwin: طَرِيقًا ?", "opts": ["ضم", "كسر", "فتح"], "a": 2, "u": "ـً met alif = fatha-tanwin (-an)."}, {"q": "Welk soort tanwin: بَيْتٍ ?", "opts": ["ضم", "كسر", "فتح"], "a": 1, "u": "ـٍ = kasra-tanwin (-in)."}, {"q": "Welk woord krijgt GEEN losse alif bij fatha-tanwin?", "opts": ["مَدْرَسَة", "كِتَاب"], "a": 0, "u": "مدرسة eindigt op ة → مدرسةً zonder losse alif."}, {"q": "Verbeter: 'كتابن' (fout gespeld)", "opts": ["كِتَابٌ", "كِتَابن"], "a": 0, "u": "Je schrijft de nun-klank niet als ن, maar als tanwin ـٌ."}, {"q": "Tanwin staat alleen op een…", "opts": ["اسم", "فعل", "حرف"], "a": 0, "u": "Alleen naamwoorden krijgen tanwin."}]}, {"key": "ishara", "emoji": "👉", "nl": "Aanwijswoorden", "ar": "أسماء الإشارة", "intro": "Woorden om iets aan te wijzen. Let op geslacht (m/v), aantal (enk/mv) en afstand (dichtbij/veraf).", "theorie": [{"h": "Dichtbij — للقريب", "ar": "هَذَا (m) · هَذِهِ (v) · هَؤُلَاءِ (mv personen)", "nl": "هذا = deze (m), هذه = deze (v), هؤلاء = deze (meervoud, mensen)."}, {"h": "Veraf — للبعيد", "ar": "ذَلِكَ (m) · تِلْكَ (v) · أُولَئِكَ (mv)", "nl": "ذلك = die (m), تلك = die (v), أولئك = die (meervoud)."}], "quiz": [{"q": "___ كِتَابٌ (m, dichtbij)", "opts": ["هَذَا", "هَذِهِ"], "a": 0, "u": "كتاب is mannelijk → هذا."}, {"q": "___ بِنْتٌ (v, dichtbij)", "opts": ["هَذَا", "هَذِهِ"], "a": 1, "u": "بنت is vrouwelijk → هذه."}, {"q": "___ طُلَّابٌ (mensen, mv, dichtbij)", "opts": ["هَذِهِ", "هَؤُلَاءِ"], "a": 1, "u": "Meervoud mensen → هؤلاء."}, {"q": "___ بَيْتٌ (m, veraf)", "opts": ["ذَلِكَ", "تِلْكَ"], "a": 0, "u": "Mannelijk + veraf → ذلك."}, {"q": "هَذِهِ gebruik je voor…", "opts": ["v enkelvoud", "m enkelvoud"], "a": 0, "u": "هذه = vrouwelijk enkelvoud."}, {"q": "أُولَئِكَ gebruik je voor…", "opts": ["meervoud (veraf)", "enkelvoud (dichtbij)"], "a": 0, "u": "أولئك = die (meervoud, veraf)."}]}, {"key": "istifham", "emoji": "❓", "nl": "Vraagwoorden", "ar": "أدوات الاستفهام", "intro": "Vraagwoorden om informatie te vragen. Leer ze met de Nederlandse betekenis (uit de stencil).", "theorie": [{"h": "Wie / wat / waar", "ar": "مَنْ = wie · مَا/مَاذَا = wat · أَيْنَ = waar", "nl": "مَنْ هَذَا الرَّجُلُ؟ (Wie is deze man?) · مَا هَذَا؟ (Wat is dit?) · أَيْنَ البَيْتُ؟ (Waar is het huis?)"}, {"h": "Wanneer / hoe / hoeveel", "ar": "مَتَى = wanneer · كَيْفَ = hoe · كَمْ = hoeveel", "nl": "مَتَى يَبْدَأُ الدَّرْسُ؟ (Wanneer begint de les?) · كَيْفَ حَالُكَ؟ (Hoe gaat het?) · كَمْ قَلَمًا عِنْدَكَ؟ (Hoeveel pennen heb je?)"}, {"h": "Hoeveel kost het? — بِكَمْ", "ar": "بِكَمْ هَذَا؟ = hoeveel kost dit?", "nl": "بِكَمْ (bikam) = 'voor hoeveel?' → je vraagt naar de PRIJS. بِكَمْ هَذَا الكِتَابُ؟ = Hoeveel kost dit boek? Antwoord bv. بِخَمْسِينَ رِيَالًا (voor vijftig riyal)."}, {"h": "Ja/nee-vraag", "ar": "هَلْ / أَ", "nl": "هَلْ تُحِبُّ العَرَبِيَّةَ؟ (Hou je van Arabisch?) — vraag met ja/nee."}], "quiz": [{"q": "___ اسْمُكَ؟ (Hoe heet je / wat is je naam?)", "opts": ["مَا", "أَيْنَ", "مَتَى"], "a": 0, "u": "Naar een naam/ding vraag je met ما."}, {"q": "___ تَسْكُنُ؟ (Waar woon je?)", "opts": ["أَيْنَ", "كَمْ", "هَلْ"], "a": 0, "u": "Plaats → أين."}, {"q": "___ عُمْرُكَ؟ (Hoe oud ben je?)", "opts": ["كَمْ", "مَنْ", "كَيْفَ"], "a": 0, "u": "Aantal/getal → كم."}, {"q": "___ حَالُكَ؟ (Hoe gaat het?)", "opts": ["كَيْفَ", "مَتَى", "مَا"], "a": 0, "u": "Naar de toestand → كيف."}, {"q": "___ مَوْعِدُ الِامْتِحَانِ؟ (Wanneer is de toets?)", "opts": ["مَتَى", "أَيْنَ", "مَنْ"], "a": 0, "u": "Tijd → متى."}, {"q": "___ هَذَا الرَّجُلُ؟ (Wie is deze man?)", "opts": ["مَنْ", "مَا", "كَمْ"], "a": 0, "u": "Naar een persoon → من."}, {"q": "Je wilt de PRIJS weten: '___ هَذَا القَمِيصُ؟' (hoeveel kost dit overhemd?)", "opts": ["بِكَمْ", "أَيْنَ", "مَتَى"], "a": 0, "u": "بِكَمْ هَذَا؟ = hoeveel kost dit? (بـ + كم = 'voor hoeveel')."}, {"q": "Wat is het verschil? كَمْ vraagt naar het aantal, بِكَمْ naar…", "opts": ["de prijs", "de plaats"], "a": 0, "u": "كَمْ قَلَمًا؟ = hoeveel pennen (aantal). بِكَمْ القَلَمُ؟ = hoeveel kost de pen (prijs)."}]}, {"key": "jam3", "emoji": "🔢", "nl": "Enkel-, twee- & meervoud", "ar": "المفرد والمثنى والجمع", "intro": "Arabisch heeft drie aantallen: enkelvoud (1), tweevoud (precies 2) en meervoud (3+).", "theorie": [{"h": "مفرد — enkelvoud", "ar": "كِتَاب، وَلَد، بِنْت", "nl": "Eén ding."}, {"h": "مثنى — tweevoud", "ar": "كِتَابَانِ، وَلَدَانِ، بِنْتَانِ", "nl": "Precies twee: voeg ـَانِ toe (of ـَيْنِ na voorzetsel/object)."}, {"h": "جمع — meervoud", "ar": "كُتُب، أَوْلَاد، بَنَات، قُصُور", "nl": "Drie of meer. Vaak 'gebroken' meervoud met een nieuwe vorm: كتاب→كُتُب, ولد→أولاد, قصر→قصور."}], "quiz": [{"q": "Tweevoud van كِتَاب", "opts": ["كِتَابَانِ", "كُتُب"], "a": 0, "u": "Tweevoud → ـَانِ: كتابان."}, {"q": "Tweevoud van قَلَم", "opts": ["قَلَمَانِ", "أَقْلَام"], "a": 0, "u": "قلمان = twee pennen."}, {"q": "Welke is enkelvoud (مفرد)?", "opts": ["قَلَم", "أَوْلَاد", "كِتَابَان"], "a": 0, "u": "قلم = één ding. أولاد = mv, كتابان = tweevoud."}, {"q": "Meervoud van بِنْت", "opts": ["بَنَات", "بِنْتَان"], "a": 0, "u": "بنات = meisjes (mv). بنتان = tweevoud."}, {"q": "Meervoud van قَصْر", "opts": ["قُصُور", "قَصْرَان"], "a": 0, "u": "Gebroken meervoud: قصور."}, {"q": "شَجَرَتَانِ is…", "opts": ["مثنى (tweevoud)", "جمع (meervoud)"], "a": 0, "u": "ـَانِ → tweevoud (twee bomen)."}, {"q": "Tweevoud van وَلَد (jongen)", "opts": ["وَلَدَانِ", "أَوْلَاد"], "a": 0, "u": "وَلَدَانِ = twee jongens. أولاد = jongens (3+)."}, {"q": "Meervoud van كِتَاب (boek)", "opts": ["كُتُب", "كِتَابَانِ"], "a": 0, "u": "كُتُب = boeken (gebroken meervoud). كتابان = tweevoud (precies 2)."}, {"q": "Welke vorm betekent precies TWEE?", "opts": ["بِنْتَانِ", "بَنَات", "بِنْت"], "a": 0, "u": "بنتان (met ـان) = twee meisjes. بنات = 3+; بنت = één."}, {"q": "أَطْفَال (kinderen) is…", "opts": ["جمع (meervoud)", "مثنى (tweevoud)", "مفرد (enkelvoud)"], "a": 0, "u": "أطفال = kinderen (3+) → meervoud. Het enkelvoud is طِفْل (één kind)."}, {"q": "Enkelvoud van أَقْلَام (pennen)?", "opts": ["قَلَم", "قَلَمَانِ"], "a": 0, "u": "أقلام is meervoud; het enkelvoud is قَلَم (één pen)."}]}, {"key": "dharf", "emoji": "🧭", "nl": "Tijd- & plaatsbijwoorden", "ar": "ظرف الزمان والمكان", "intro": "Bijwoorden van tijd (متى؟ wanneer) en plaats (أين؟ waar). Heel nuttig in je schrijfopdracht!", "theorie": [{"h": "ظرف الزمان — tijd (wanneer?)", "ar": "اليَوْم، أَمْس، غَدًا، الآن، دَائِمًا", "nl": "vandaag · gisteren · morgen · nu · altijd. Ook: أحيانًا (soms), صباحًا (’s ochtends), مساءً (’s avonds), كل يوم (elke dag)."}, {"h": "ظرف المكان — plaats (waar?)", "ar": "فَوْق، تَحْت، أَمَام، خَلْف، بَيْن", "nl": "boven/op · onder · voor · achter · tussen. Ook: هنا (hier), هناك (daar), بجانب (naast), يمين (rechts), يسار (links), قريب (dichtbij)."}], "vocab": [["اليَوْم", "vandaag"], ["أَمْس", "gisteren"], ["غَدًا", "morgen"], ["الآن", "nu"], ["دَائِمًا", "altijd"], ["أَحْيَانًا", "soms"], ["صَبَاحًا", "’s ochtends"], ["مَسَاءً", "’s avonds"], ["فَوْق", "boven/op"], ["تَحْت", "onder"], ["أَمَام", "voor"], ["خَلْف", "achter"], ["بَيْن", "tussen"], ["بِجَانِب", "naast"], ["يَمِين", "rechts"], ["يَسَار", "links"], ["هُنَا", "hier"], ["هُنَاك", "daar"], ["قَرِيب", "dichtbij"], ["بَعِيد", "ver"]], "quiz": [{"q": "أَذْهَبُ إِلَى الجَامِعَةِ ___ (naar uni in de ochtend)", "opts": ["صَبَاحًا", "فَوْق", "لَيْلًا"], "a": 0, "u": "صباحًا = ’s ochtends (tijd)."}, {"q": "سَأُسَافِرُ إِلَى أَمْسْتَرْدَام ___ (ik zal morgen reizen)", "opts": ["غَدًا", "تَحْت", "أَمَام"], "a": 0, "u": "غدًا = morgen (tijd)."}, {"q": "الحَقِيبَةُ ___ الكُرْسِيِّ (de tas onder de stoel)", "opts": ["تَحْت", "غَدًا", "مَسَاءً"], "a": 0, "u": "تحت = onder (plaats)."}, {"q": "الكِتَابُ ___ الطَّاوِلَةِ (het boek op tafel)", "opts": ["فَوْق", "أَمْس", "دَائِمًا"], "a": 0, "u": "فوق = boven/op (plaats)."}, {"q": "القَلَمُ ___ الكِتَابِ وَالدَّفْتَرِ (pen tussen boek en schrift)", "opts": ["بَيْن", "غَدًا", "مُبَكِّرًا"], "a": 0, "u": "بين = tussen (plaats)."}, {"q": "'غَدًا' is een bijwoord van…", "opts": ["tijd (زمان)", "plaats (مكان)"], "a": 0, "u": "غدًا (morgen) → tijd."}, {"q": "القِطَّةُ تَنَامُ ___ الطَّاوِلَةِ (de kat slaapt onder de tafel)", "opts": ["تَحْت", "فَوْق", "أَمْس"], "a": 0, "u": "تحت = onder (plaats). فوق = boven, أمس = gisteren."}, {"q": "أَزُورُ جَدَّتِي ___ (ik bezoek mijn oma soms)", "opts": ["أَحْيَانًا", "خَلْف", "دَاخِل"], "a": 0, "u": "أحيانًا = soms (tijd). خلف = achter, داخل = binnen."}, {"q": "أَدْرُسُ العَرَبِيَّةَ ___ (ik studeer Arabisch 's avonds)", "opts": ["مَسَاءً", "فَوْق", "بَيْن"], "a": 0, "u": "مساءً = 's avonds (tijd)."}, {"q": "Wat betekent خَلْف?", "opts": ["achter", "voor", "naast"], "a": 0, "u": "خَلْف = achter. أمام = voor, بجانب = naast."}, {"q": "Wat betekent يَمِين?", "opts": ["rechts", "links", "boven"], "a": 0, "u": "يمين = rechts, يسار = links, فوق = boven."}, {"q": "'هُنَا' is een bijwoord van…", "opts": ["plaats (مكان)", "tijd (زمان)"], "a": 0, "u": "هنا (hier) → plaats."}]}], "toekomst": {"intro": "In het transcript van de laatste les (Hadj/Umrah/Eid) gebruikt de docent veel de TOEKOMENDE tijd. Handig als bonus.", "rijen": [["سـ + werkwoord", "سَـ", "binnenkort — سَيَذْهَبُ = hij zal (zo) gaan"], ["سوف + werkwoord", "سَوْفَ", "in de (verdere) toekomst — سَوْفَ أُسَافِرُ = ik zal reizen"], ["سَأَذْهَبُ", "sa-adhhabu", "ik zal gaan"], ["سَنَذْهَبُ", "sa-nadhhabu", "wij zullen gaan (سنسافر = wij zullen reizen)"]], "tip": "Je vormt de toekomst op de tegenwoordige tijd (مضارع): plak سـ ervoor. Toets gaat vooral over de VERLEDEN tijd — zie tab Vervoeg — maar herken de toekomst ook."}, "lessons": [{"id": "b2u1", "boek": "Boek 2 · Deel 1", "unit": 1, "emoji": "🩺", "themeAr": "العِنَايَة بِالصِّحَّة", "theme": {"nl": "Zorg voor de gezondheid", "en": "Health care"}, "intro": {"nl": "In dit hoofdstuk leer je praten over ziek zijn, pijn, de dokter, medicijnen en gezond eten. De grammatica draait om de voorzetsels (حروف الجر), ontkennen met لا, de drie tijden, en de woordsoorten.", "en": "In this unit you learn to talk about being ill, pain, the doctor, medicine and healthy food. The grammar covers the prepositions (حروف الجر), negation with لا, the three tenses, and the parts of speech."}, "leerdoelen": [{"nl": "Ik kan vertellen dat ik ziek ben en zeggen waar ik pijn heb (أَشْعُرُ بِأَلَمٍ فِي...).", "en": "I can say that I am ill and where it hurts (أَشْعُرُ بِأَلَمٍ فِي...)."}, {"nl": "Ik kan informeren naar de behandeling en het dieet (العِلاج، الحِمْية).", "en": "I can ask about the treatment and the diet (العِلاج، الحِمْية)."}, {"nl": "Ik kan de voorzetsels (مِن، في، إلى، على، عن، بـ، لـ) correct gebruiken.", "en": "I can use the prepositions (مِن، في، إلى، على، عن، بـ، لـ) correctly."}, {"nl": "Ik kan een zin ontkennen met لا (لا النافية).", "en": "I can negate a sentence with لا (لا النافية)."}, {"nl": "Ik herken en gebruik de verleden, tegenwoordige en toekomende tijd.", "en": "I recognise and use the past, present and future tense."}, {"nl": "Ik kan woorden indelen in naamwoord (اسم), werkwoord (فعل) en partikel (حرف).", "en": "I can classify words as noun (اسم), verb (فعل) or particle (حرف)."}, {"nl": "Ik ken de kernwoordenschat rond gezondheid, behandeling en voeding + enkele meervouden.", "en": "I know the core vocabulary of health, treatment and food + some plurals."}], "woorden": [{"ar": "الصِّحَّة", "nl": "de gezondheid", "en": "health"}, {"ar": "مَريض", "nl": "ziek", "en": "ill / sick"}, {"ar": "مَرَض / أَمْراض", "nl": "ziekte / ziekten", "en": "illness / illnesses"}, {"ar": "أَلَم / آلام", "nl": "pijn / pijnen", "en": "pain / pains"}, {"ar": "صُداع", "nl": "hoofdpijn", "en": "headache"}, {"ar": "بَطْن", "nl": "buik", "en": "belly / stomach"}, {"ar": "رَأْس", "nl": "hoofd", "en": "head"}, {"ar": "طَبيب / أَطِبّاء", "nl": "dokter / dokters", "en": "doctor / doctors"}, {"ar": "دَواء / أَدْوِية", "nl": "medicijn / medicijnen", "en": "medicine / medicines"}, {"ar": "عِلاج", "nl": "behandeling", "en": "treatment"}, {"ar": "حِمْيَة", "nl": "dieet", "en": "diet"}, {"ar": "شِفاء", "nl": "genezing", "en": "healing / cure"}, {"ar": "عَسَل", "nl": "honing", "en": "honey"}, {"ar": "أَشْعُرُ بِـ", "nl": "ik voel (pijn)", "en": "I feel (pain)"}, {"ar": "تَناوَلَ", "nl": "innemen (medicijn/eten)", "en": "to take (medicine/food)"}, {"ar": "عالَجَ", "nl": "behandelen", "en": "to treat"}, {"ar": "شَفى", "nl": "genezen (iemand)", "en": "to cure (someone)"}, {"ar": "اِشْتَرى", "nl": "kopen", "en": "to buy"}, {"ar": "اِشْتَكى مِنْ", "nl": "klagen over", "en": "to complain about"}, {"ar": "صِحّي", "nl": "gezond (bijv. eten)", "en": "healthy (e.g. food)"}, {"ar": "البَدانَة", "nl": "dikheid / overgewicht", "en": "obesity / being overweight"}, {"ar": "النَّحافَة", "nl": "magerheid", "en": "thinness"}, {"ar": "أَطْعِمَة", "nl": "voedingsmiddelen", "en": "foods"}, {"ar": "الصَّيْدَلِيَّة", "nl": "de apotheek", "en": "the pharmacy"}], "dialoog": {"titelAr": "في العَسَلِ شِفاءٌ", "titel": {"nl": "In honing zit genezing", "en": "There is healing in honey"}, "bron": {"nl": "Naar Bayna Yadayk Boek 2, Wehda 1, Les 1. Bestudeer de dialoog in je boek; hieronder met vertaling ter ondersteuning.", "en": "Based on Bayna Yadayk Book 2, Unit 1, Lesson 1. Study the dialogue in your book; below it is given with a translation to support you."}, "regels": [["حازم", "أَمَريضٌ أَنْتَ؟", {"nl": "Ben je ziek?", "en": "Are you ill?"}], ["عامر", "نَعَمْ، أَشْعُرُ بِآلامٍ شَديدةٍ في بَطْني.", {"nl": "Ja, ik voel hevige pijn in mijn buik.", "en": "Yes, I feel severe pain in my belly."}], ["حازم", "هَلْ ذَهَبْتَ إلى الطَّبيبِ؟", {"nl": "Ben je naar de dokter geweest?", "en": "Have you been to the doctor?"}], ["عامر", "لا، لَمْ أَذْهَبْ إلى الطَّبيبِ، ولَمْ أَتَناوَلْ أيَّ دَواءٍ.", {"nl": "Nee, ik ben niet naar de dokter geweest en heb geen enkel medicijn genomen.", "en": "No, I have not been to the doctor and I have not taken any medicine."}], ["حازم", "هَلْ سَمِعْتَ قِصَّةَ الصَّحابيِّ الذي عالَجَهُ الرَّسولُ ﷺ؟", {"nl": "Ken je het verhaal van de metgezel die de Profeet ﷺ behandelde?", "en": "Do you know the story of the companion whom the Prophet ﷺ treated?"}], ["عامر", "لا، لَمْ أَسْمَعْ بِها. مِمَّ اشْتَكى الصَّحابيُّ؟", {"nl": "Nee, dat ken ik niet. Waarover klaagde de metgezel?", "en": "No, I don't know it. What did the companion complain about?"}], ["حازم", "اِشْتَكى مِنْ بَطْنِهِ.", {"nl": "Hij klaagde over zijn buik.", "en": "He complained about his belly."}], ["عامر", "وكَيْفَ عالَجَهُ الرَّسولُ ﷺ؟", {"nl": "En hoe behandelde de Profeet ﷺ hem?", "en": "And how did the Prophet ﷺ treat him?"}], ["حازم", "أَمَرَ أَخاهُ أنْ يَسْقِيَهُ عَسَلاً.", {"nl": "Hij beval zijn broer hem honing te geven.", "en": "He ordered his brother to give him honey."}], ["عامر", "وهَلْ شُفِيَ؟", {"nl": "En is hij genezen?", "en": "And was he cured?"}], ["حازم", "نَعَمْ، بَعْدَ أنْ سَقاهُ ثَلاثَ مَرّاتٍ.", {"nl": "Ja, nadat hij hem drie keer had gegeven.", "en": "Yes, after he had given it to him three times."}], ["عامر", "سَأَتَناوَلُ العَسَلَ مِثْلَ هذا الصَّحابيِّ.", {"nl": "Ik ga honing nemen, net als deze metgezel.", "en": "I will take honey, just like this companion."}], ["حازم", "شَفاكَ اللهُ.", {"nl": "Moge Allah je genezen.", "en": "May Allah cure you."}], ["عامر", "جَزاكَ اللهُ خَيْراً.", {"nl": "Moge Allah je belonen.", "en": "May Allah reward you."}]]}, "grammatica": [{"titel": {"nl": "حُروف الجَرّ — voorzetsels", "en": "حُروف الجَرّ — prepositions"}, "uitleg": {"nl": "De voorzetsels مِن، في، إلى، على، عن، بـ، لـ zetten het naamwoord dat erop volgt in de جَرّ-naamval: dat woord krijgt een kasra (of kasra-tanwin) aan het eind.", "en": "The prepositions مِن، في، إلى، على، عن، بـ، لـ put the following noun in the جَرّ (genitive) case: that word takes a kasra (or kasra-tanwin) at the end."}, "voorbeelden": [["أَشْعُرُ بِأَلَمٍ.", {"nl": "Ik voel pijn.", "en": "I feel pain."}], ["الأَلَمُ في البَطْنِ.", {"nl": "De pijn zit in de buik.", "en": "The pain is in the belly."}], ["ذَهَبْتُ إلى الطَّبيبِ.", {"nl": "Ik ging naar de dokter.", "en": "I went to the doctor."}], ["سوقُ العَسَلِ بَعيدٌ عَنِ البَيْتِ.", {"nl": "De honingmarkt is ver van huis.", "en": "The honey market is far from home."}]], "quiz": [{"q": {"nl": "المَدينةُ بَعيدةٌ ___ البَيتِ. (ver … huis)", "en": "المَدينةُ بَعيدةٌ ___ البَيتِ. (far … home)"}, "opts": ["مِنْ", "إلى", "بـ"], "a": 0, "u": {"nl": "بعيد عن/من → 'ver van'. Hier past مِن.", "en": "بعيد عن/من → 'far from'. Here مِن fits."}}, {"q": {"nl": "أَذْهَبُ إلى العَمَلِ ___ السَّيّارةِ. (met de auto)", "en": "أَذْهَبُ إلى العَمَلِ ___ السَّيّارةِ. (by car)"}, "opts": ["بِـ", "في", "عَنْ"], "a": 0, "u": {"nl": "'met/per' een vervoermiddel → بـ: بالسيارةِ.", "en": "'by' a means of transport → بـ: بالسيارةِ."}}, {"q": {"nl": "أَدْرُسُ سِتَّ حِصَصٍ ___ اليَومِ. (op een dag)", "en": "أَدْرُسُ سِتَّ حِصَصٍ ___ اليَومِ. (in a day)"}, "opts": ["في", "لـ", "على"], "a": 0, "u": {"nl": "tijd 'in/op' → في اليومِ.", "en": "time 'in/on' → في اليومِ."}}, {"q": {"nl": "هُناكَ سوقٌ ___ بَيعِ العَسَلِ. (voor het verkopen)", "en": "هُناكَ سوقٌ ___ بَيعِ العَسَلِ. (for selling)"}, "opts": ["لـ", "عَنْ", "مِنْ"], "a": 0, "u": {"nl": "doel 'voor/om te' → لـ: لبيعِ.", "en": "purpose 'for/to' → لـ: لبيعِ."}}, {"q": {"nl": "Wat doet een حرف جر met het volgende naamwoord?", "en": "What does a حرف جر do to the following noun?"}, "opts": [{"nl": "kasra (جَرّ)", "en": "kasra (genitive)"}, {"nl": "damma (رفع)", "en": "damma (nominative)"}, {"nl": "fatha (نصب)", "en": "fatha (accusative)"}], "a": 0, "u": {"nl": "Voorzetsels geven het volgende naamwoord een kasra (majroor).", "en": "Prepositions give the following noun a kasra (majroor)."}}]}, {"titel": {"nl": "لا النّافِية — ontkennen met لا", "en": "لا النّافِية — negation with لا"}, "uitleg": {"nl": "لا vóór een werkwoord in de tegenwoordige tijd betekent 'niet (doen)'. Let op: لا + gebiedende wijs (لا الناهية) betekent 'doe niet!' — dat is een ander gebruik.", "en": "لا before a present-tense verb means 'do not (do)'. Note: لا + imperative (لا الناهية) means 'don't!' — that is a different use."}, "voorbeelden": [["لا أَشْعُرُ بِأَلَمٍ.", {"nl": "Ik voel geen pijn.", "en": "I don't feel pain."}], ["لا آكُلُ طَعاماً غَيْرَ صِحّيٍّ.", {"nl": "Ik eet geen ongezond eten.", "en": "I don't eat unhealthy food."}], ["لا تَأْكُلْ كَثيراً! (ناهية)", {"nl": "Eet niet veel! (verbod)", "en": "Don't eat a lot! (prohibition)"}]], "quiz": [{"q": {"nl": "'Ik ga niet naar de dokter' = أنا ___ إلى الطبيبِ", "en": "'I don't go to the doctor' = أنا ___ إلى الطبيبِ"}, "opts": ["لا أَذْهَبُ", "لا اذْهَبْ", "لَنْ ذهبت"], "a": 0, "u": {"nl": "لا + tegenwoordige tijd: لا أَذْهَبُ = ik ga niet.", "en": "لا + present tense: لا أَذْهَبُ = I don't go."}}, {"q": {"nl": "لا في 'لا تَأْكُلْ كَثيراً' is…", "en": "The لا in 'لا تَأْكُلْ كَثيراً' is…"}, "opts": [{"nl": "ناهية (verbod)", "en": "ناهية (prohibition)"}, {"nl": "نافية (ontkenning)", "en": "نافية (negation)"}], "a": 0, "u": {"nl": "Voor een gebiedende vorm → لا الناهية (doe niet!).", "en": "Before an imperative → لا الناهية (don't!)."}}, {"q": {"nl": "لا في 'لا أُحِبُّ الدَّواءَ' is…", "en": "The لا in 'لا أُحِبُّ الدَّواءَ' is…"}, "opts": [{"nl": "نافية (ontkenning)", "en": "نافية (negation)"}, {"nl": "ناهية (verbod)", "en": "ناهية (prohibition)"}], "a": 0, "u": {"nl": "Voor een tegenwoordige tijd → لا النافية (ik hou niet van).", "en": "Before a present tense → لا النافية (I don't like)."}}]}, {"titel": {"nl": "الماضي · الحاضر · المستقبل — de drie tijden", "en": "الماضي · الحاضر · ا function speak(t){
  if(!('speechSynthesis' in window) || !t) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='ar-SA'; u.rate=0.85;
    const vs=speechSynthesis.getVoices(); const av=vs.filter(v=>/^ar/i.test(v.lang));
    if(av.length) u.voice=av[0];
    speechSynthesis.speak(u);
  }catch(e){}
}

// Arabisch normaliseren voor type-check (negeer harakat & alef-varianten)
function norm(s){
  return (s||'').replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[\u0622\u0623\u0625]/g,'\u0627')
    .replace(/\u0649/g,'\u064A').replace(/\u0629/g,'\u0647')
    .replace(/\s+/g,'').trim();
}

/* ---------- VANDAAG (dagelijkse inhaalslag-motor) ---------- */
function navTo(tab){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); }
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayState(){ let s; try{ s=JSON.parse(localStorage.getItem('byk2day')||'{}'); }catch(e){ s={}; } if(!s.checks)s.checks={date:'',done:[]}; if(s.streak==null)s.streak=0; if(s.dayCount==null)s.dayCount=0; return s; }
function saveDay(s){ localStorage.setItem('byk2day', JSON.stringify(s)); }
const DAG_ITEMS = [
  {ic:'🔁', act:'goReview', label:n=>'Woorden herhalen — '+n},
  {ic:'📐', act:'goGramR', label:n=>'Grammatica herhalen — '+n},
  {ic:'🔤', act:'goVerv', label:()=>'Werkwoorden vervoegen (verleden tijd)'},
  {ic:'⭐', act:'goLearn', label:()=>'Je fouten wegwerken (★ nog-leren)'},
  {ic:'📘', act:'goNieuw', label:n=>'Nieuw thema — '+n},
];
function renderVandaag(){
  const s=dayState();
  const today=dstr(new Date()); const yd=new Date(); yd.setDate(yd.getDate()-1); const yest=dstr(yd);
  if(s.checks.date!==today){ s.checks={date:today, done:[false,false,false,false,false]}; s.aheadToday=0; saveDay(s); }
  // roulerende herhaal-doelen
  const REV=DATA.units2.map(u=>({qpart:2,unit:u.n,theme:u.themeNl})).concat(DATA.units1.map(u=>({qpart:1,unit:u.n,theme:u.themeNl})));
  const rev=REV[s.dayCount % REV.length];
  const GK=DATA.grammatica; const gk=GK[s.dayCount % GK.length];
  const nieuw=DATA.lessons[Math.min(s.dayCount, DATA.lessons.length-1)] || DATA.lessons[DATA.lessons.length-1];
  window.__dagCtx={rev, gk, nieuw};
  const doneToday = s.lastDone===today;
  const allChecked = s.checks.done.every(x=>x);
  let h='<h2>📅 Vandaag — jouw Arabische inhaalslag</h2>';
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><div><div style="font-size:13px" class="mut">${esc(today)}${s.aheadToday?` · 🔜 vooruit-modus (+${s.aheadToday})`:''}</div><div style="font-size:15px;font-weight:700">🔥 Streak: ${s.streak||0} dag${(s.streak||0)===1?'':'en'}${doneToday?' — vandaag ✓':''}</div></div><div style="font-size:34px">${doneToday?'✅':'📖'}</div></div></div>`;
  h+='<div class="tip">Doe elke dag dit rijtje (±30 min). De herhaling rouleert automatisch door alle vorige thema\'s, zodat je inhaalt én bijblijft. Tik "Doe" → oefen → kom terug → vink af.</div>';
  DAG_ITEMS.forEach((it,i)=>{
    const nm = i===0?rev.theme : i===1?gk.nl : i===4?(L(nieuw.theme)+' ('+nieuw.boek.split('·').pop().trim()+' U'+nieuw.unit+')') : '';
    const done=s.checks.done[i];
    h+=`<div class="card" style="padding:12px 14px${done?';opacity:.6':''}"><div class="row" style="justify-content:space-between;align-items:center"><div style="flex:1"><b>${done?'✅ ':''}${it.ic} ${esc(it.label(nm))}</b></div><label style="display:flex;align-items:center;gap:6px;font-size:13px" class="mut"><input type="checkbox" ${done?'checked':''} onclick="toggleDag(${i})" style="width:20px;height:20px"> af</label></div><div class="row" style="margin-top:8px"><button class="btn" onclick="dagDo(${i})">Doe ▶</button></div></div>`;
  });
  if(doneToday){
    h+=`<div class="row" style="margin-top:6px"><button class="btn sec" disabled>Vandaag afgerond ✓</button><button class="btn gold" onclick="startVolgendeDag()">▶ Volgende dag alvast</button></div>`;
    h+='<div class="tip">Zin in meer? Start alvast de volgende dag: verse taken + het volgende thema in de rotatie. Je streak blijft eerlijk (1 per kalenderdag) — dit is vooruitwerken, geen streak-inflatie.</div>';
  } else {
    h+=`<div class="row" style="margin-top:6px"><button class="btn ${allChecked?'gold':'sec'}" onclick="finishDay()">🔥 Dag afronden</button></div>`;
  }
  // augustus-plan
  h+='<h3>📆 Augustus-herstart (2 weken · meer tijd nu)</h3><div class="card">';
  const AUG=[
    ['16–22 aug','Herstart: Boek 1 volledig inhalen (thema 1–16) — 2–3 thema\'s/dag: woorden + grammatica + vervoegen. Meer tijd → gerust 2 rondes/dag.'],
    ['23–31 aug','Boek 2 Unit 1 + 2 volledig (lessen + zelftoetsen) + alles consolideren + je zwakke plekken (★).'],
  ];
  AUG.forEach(w=>h+=`<div class="plan-item"><div class="plan-tijd" style="min-width:90px">${esc(w[0])}</div><div class="plan-wat">${esc(w[1])}</div></div>`);
  h+='</div><div class="tip">Fris begin vanaf 16 aug. Je hebt nu meer tijd — bouw de streak opnieuw op; de kennis komt snel terug omdat je het eerder al zag.</div>';
  view.innerHTML=h;
}
function toggleDag(i){ const s=dayState(); const today=dstr(new Date()); if(s.checks.date!==today)s.checks={date:today,done:[false,false,false,false,false]}; s.checks.done[i]=!s.checks.done[i]; saveDay(s); renderVandaag(); }
function finishDay(){ const s=dayState(); const today=dstr(new Date()); const yd=new Date(); yd.setDate(yd.getDate()-1); const yest=dstr(yd); if(s.lastDone===today) return; s.streak = (s.lastDone===yest)? s.streak+1 : 1; s.best=Math.max(s.best||0,s.streak); s.lastDone=today; s.dayCount=(s.dayCount||0)+1; saveDay(s); renderVandaag(); }
// vooruitwerken: verse taken + volgende thema-rotatie, zonder de streak (per kalenderdag) te inflateren
function startVolgendeDag(){ const s=dayState(), today=dstr(new Date()); s.dayCount=(s.dayCount||0)+1; s.checks={date:today,done:[false,false,false,false,false]}; s.aheadToday=(s.aheadToday||0)+1; saveDay(s); renderVandaag(); }
function goReview(){ const c=window.__dagCtx; navTo('quiz'); qpart=c.rev.qpart; quizSel=c.rev.unit; startQuiz('mc',false); }
function goGramR(){ const c=window.__dagCtx; navTo('grammatica'); startGramQuiz(c.gk.key); }
function goVerv(){ navTo('vervoeg'); vvMode='drill'; renderVervoeg(); }
function goLearn(){ navTo('quiz'); qpart=2; quizSel=-1; startQuiz('mc',true); }
function goNieuw(){ window.__dagActive=null; window.__dagNieuwPending=true; const c=window.__dagCtx; navTo('lesplan'); renderLesplan(c.nieuw.id); } // les = handmatig, behalve de zelftoets (zie dagMarkLes)
// start een Vandaag-taak én onthoud welke, zodat afronding 'm automatisch afvinkt
function dagDo(i){ window.__dagActive=i; const fn=window[DAG_ITEMS[i].act]; if(fn) fn(); }
// aangeroepen op elk quiz/oefening-resultaatscherm: vinkt de gestarte Vandaag-taak af.
// Geeft HTML terug (een 'terug naar Vandaag'-knop) als er iets is afgevinkt, anders ''.
function dagMark(){
  if(window.__dagActive==null) return '';
  const i=window.__dagActive; window.__dagActive=null;
  const s=dayState(); const today=dstr(new Date());
  if(s.checks.date!==today) s.checks={date:today,done:[false,false,false,false,false]};
  s.checks.done[i]=true; saveDay(s);
  const done=s.checks.done, allDone=done.every(x=>x);
  // volgende openstaande oefen-taak (0-3); item 4 = les = handmatig
  let nxt=-1; for(let k=0;k<4;k++){ if(!done[k]){ nxt=k; break; } }
  if(nxt>=0) return `<button class="btn gold" onclick="dagNext()">✓ Afgevinkt — volgende taak ▶</button>`;
  if(!done[4]) return '<button class="btn gold" onclick="go(\'vandaag\')">✓ Afgevinkt — nog: 📘 nieuw thema (handmatig)</button>';
  return '<button class="btn gold" onclick="go(\'vandaag\')">✓ Alles gedaan! 🔥 Dag afronden</button>';
}
function dagNext(){
  const s=dayState(), today=dstr(new Date());
  if(s.checks.date!==today){ go('vandaag'); return; }
  for(let k=0;k<4;k++){ if(!s.checks.done[k]){ dagDo(k); return; } }
  go('vandaag'); // oefen-taken klaar → terug (nieuw thema is handmatig / dag afronden)
}
// voor les-quizzes: vinkt 'nieuw thema' (item 4) alléén af bij de zelftoets die uit Vandaag is gestart
function dagMarkLes(){
  if(!(typeof lq!=='undefined' && lq && lq.isToets && window.__dagNieuwPending)) return dagMark();
  window.__dagNieuwPending=false;
  const s=dayState(), today=dstr(new Date());
  if(s.checks.date!==today) s.checks={date:today,done:[false,false,false,false,false]};
  s.checks.done[4]=true; saveDay(s);
  for(let k=0;k<4;k++){ if(!s.checks.done[k]) return '<button class="btn gold" onclick="dagNext()">✓ Nieuw thema af — volgende taak ▶</button>'; }
  return '<button class="btn gold" onclick="go(\'vandaag\')">✓ Alles gedaan! 🔥 Dag afronden</button>';
}

  });

  view.innerHTML=h;
}
function exportProgress(){
  const data={_app:'bayna-yadayk', _exported:new Date().toISOString()};
  ['byk2day','byk2sprint','byk2scale','byk2lang'].forEach(k=>{ const v=localStorage.getItem(k); if(v!=null) data[k]=v; });
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='byk-voortgang.json'; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove(); URL.revokeObjectURL(a.href);},100);
}
function importProgress(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){ try{ const data=JSON.parse(r.result);
    ['byk2day','byk2sprint','byk2scale','byk2lang'].forEach(k=>{ if(data[k]!=null) localStorage.setItem(k, data[k]); });
    store=JSON.parse(localStorage.getItem('byk2sprint')||'{}'); if(!store.learn) store.learn={};
    lang=localStorage.getItem('byk2lang')||'nl';
    txtScale=parseFloat(localStorage.getItem('byk2scale')); if(!txtScale||isNaN(txtScale)) txtScale=1.15; applyScale();
    alert('Voortgang geïmporteerd ✓'); renderVoortgang();
  }catch(e){ alert('Kon dit bestand niet lezen (geen geldige voortgang-back-up).'); } };
  r.readAsText(f);
}

/* ---------- DIAGNOSE (Deel 1) ---------- */
let diagState=null;
function startDiag(){
  // 20 willekeurige Deel 1 woorden, NL->AR meerkeuze
  const all=[]; DATA.units1.forEach(u=>u.terms.forEach(t=>all.push({...t,unit:u.n,theme:u.themeNl})));
  const pick=shuffle(all.slice()).slice(0,20);
  diagState={q:pick,i:0,score:0,wrongThemes:{}};
  renderDiag();
}
function renderDiag(){
  if(!diagState){ view.innerHTML='<h2>🩺 Diagnose Deel 1</h2><div class="card">Snelle test (20 woorden) om te zien of Deel 1 erin zit. Kies bij elke Nederlandse betekenis het juiste Arabische woord.<br><br><button class="btn" onclick="startDiag()">Start diagnose</button></div>'; return; }
  if(diagState.i>=diagState.q.length){ return diagResult(); }
  const cur=diagState.q[diagState.i];
  const opts=buildOpts(cur,DATA.units1,'ar');
  let h=`<h2>🩺 Diagnose Deel 1</h2><div class="counter">Vraag ${diagState.i+1} / ${diagState.q.length} · score ${diagState.score}</div>`;
  h+='<div class="progress"><i style="width:'+(diagState.i/diagState.q.length*100)+'%"></i></div>';
  h+=`<div class="card"><div class="mut">Welk woord betekent:</div><div style="font-size:24px;font-weight:700;margin:6px 0">${esc(cur.nl)}</div>`;
  opts.forEach(o=>{ h+=`<button class="opt ar" onclick="diagAns(this,'${esc(o.ar)}','${esc(cur.ar)}','${esc(cur.theme)}')">${esc(o.ar)}</button>`; });
  h+='<div id="diagVerdict"></div></div>';
  view.innerHTML=h;
}
function diagAns(btn,chosen,correct,theme){
  const good = norm(chosen)===norm(correct);
  document.querySelectorAll('.opt').forEach(b=>{b.style.pointerEvents='none'; if(norm(b.textContent)===norm(correct))b.classList.add('good');});
  __adv=()=>{diagState.i++; renderDiag();};
  if(good){ diagState.score++; setTimeout(advNow,1500); }
  else { btn.classList.add('bad'); diagState.wrongThemes[theme]=(diagState.wrongThemes[theme]||0)+1;
    $('#diagVerdict').innerHTML=`<div class="verdict no" style="margin-top:8px">✗ Juist: <span class="ar" style="font-size:24px">${esc(correct)}</span></div><button class="btn" style="margin-top:10px" onclick="advNow()">Volgende ▶</button>`; }
}
function diagResult(){
  const s=diagState.score, t=diagState.q.length, pct=Math.round(s/t*100);
  let advies = pct>=80? 'Deel 1 zit solide. Focus je tijd ~85% op Deel 2.' :
               pct>=55? 'Deel 1 is wankel. Pak eerst de zwakke thema\'s hieronder, daarna Deel 2.' :
               'Deel 1 is flink weggezakt. Begin met de zwakke thema\'s hieronder voordat je Deel 2 doet.';
  let weak=Object.entries(diagState.wrongThemes).sort((a,b)=>b[1]-a[1]);
  let h=`<h2>🩺 Resultaat diagnose</h2><div class="card"><div style="font-size:34px;font-weight:800;color:${pct>=80?'var(--acc)':pct>=55?'var(--gold)':'var(--red)'}">${s}/${t} · ${pct}%</div><div style="margin-top:8px">${esc(advies)}</div></div>`;
  if(weak.length){
    h+='<h3>📋 Mijn advies: doe deze thema\'s in deze volgorde</h3><div class="card">';
    weak.forEach((w,i)=>{ h+=`<div class="plan-item"><div class="plan-tijd" style="min-width:26px">${i+1}.</div><div style="flex:1"><div class="plan-blok">${esc(w[0])}</div><div class="plan-wat">${w[1]} fout — oefen de woorden van dit Deel 1-thema.</div><button class="btn sec" style="margin-top:6px" onclick="oefenDeel1('${esc(w[0])}')">Oefen ▶</button></div></div>`; });
    h+='</div><div class="tip">Dit oordeel komt automatisch uit je foute antwoorden — geen aparte database nodig. Het meeste fout bovenaan = eerst doen. Tik op "Oefen" om meteen de Deel 1-woordkaarten van dat thema te openen.</div>';
  } else {
    h+='<div class="card"><b>Geen zwakke thema\'s</b> — Deel 1 zit goed. Ga door naar Deel 2 (Woorden + Grammatica).</div>';
  }
  h+='<div class="row"><button class="btn" onclick="startDiag()">Opnieuw</button><button class="btn sec" onclick="go(\'woorden\')">Naar Deel 2-woorden</button></div>';
  view.innerHTML=h; diagState=null;
}

function startGramQuiz(key){ const t=DATA.grammatica.find(x=>x.key===key); runGramQuiz(t, shuffle(t.quiz.slice())); }
function runGramQuiz(t,qs){ gramState={topic:t,q:qs,i:0,score:0,wrong:[]}; drawGramQuiz(); }
function drawGramQuiz(){
  const st=gramState;
  if(st.i>=st.q.length) return gramResult();
  const c=st.q[st.i];
  let h=`<h2>${esc(st.topic.emoji)} ${esc(st.topic.nl)}</h2><div class="counter">${st.i+1}/${st.q.length} · score ${st.score}</div>`;
  h+='<div class="progress"><i style="width:'+(st.i/st.q.length*100)+'%"></i></div>';
  h+=`<div class="card"><div style="font-size:18px;font-weight:700;margin-bottom:8px" class="ar-mix">${esc(c.q)}</div>`;
  c.opts.forEach((o,idx)=>{ h+=`<button class="opt" style="text-align:center" onclick="gramAns(this,${idx},${c.a})"><span class="ar" style="font-size:23px">${esc(o)}</span></button>`; });
  h+='<div id="gramVerdict"></div></div>';
  view.innerHTML=h;
}
function gramAns(btn,chosen,correct){
  const c=gramState.q[gramState.i];
  document.querySelectorAll('.opt').forEach((b,idx)=>{b.style.pointerEvents='none'; if(idx===correct)b.classList.add('good');});
  const ok=chosen===correct;
  if(ok) gramState.score++; else { btn.classList.add('bad'); gramState.wrong.push(c); }
  __adv=()=>{gramState.i++; drawGramQuiz();};
  $('#gramVerdict').innerHTML=`<div class="verdict ${ok?'ok':'no'}" style="margin-top:10px">${ok?'✓ Goed!':'✗ Fout'} <span class="mut" style="font-weight:400">${esc(c.u)}</span></div>`
    + (ok?'':'<button class="btn" style="margin-top:10px" onclick="advNow()">Volgende ▶</button>');
  if(ok) setTimeout(advNow,2200);
}
function gramResult(){

  h+=`<button class="btn" onclick="startGramQuiz('${gramState.topic.key}')">Opnieuw</button><button class="btn sec" onclick="renderGram('${gramState.topic.key}')">Theorie</button><button class="btn sec" onclick="renderGram()">Ander</button></div>`;

}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor((i+1)*pseudo()); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let _seed=Date.now? Date.now()%2147483647 : 1;
function pseudo(){ _seed=(_seed*16807)%2147483647; return (_seed-1)/2147483646; }
function buildOpts(cur,units,field){
  const all=[]; units.forEach(u=>u.terms.forEach(t=>all.push(t)));
  const distract=shuffle(all.filter(t=>norm(t.ar)!==norm(cur.ar))).slice(0,3);
  return shuffle([cur,...distract]);
}

    h+=`<div class="card"><div dir="auto">${esc(L(w.opdracht))}</div><div style="margin-top:8px">`;
    w.woorden.forEach(x=>h+=`<span class="chip ar" style="font-size:19px">${esc(x)}</span>`);
    h+=`</div></div><div class="card"><textarea class="ar" placeholder="...اكتب هنا"></textarea><div class="row" style="margin-top:10px"><button class="btn gold" onclick="toggleLesModel()">${esc(lt('toonmodel'))}</button></div><div id="lesModel" class="hidden"></div></div>`;
  } else if(s==='toets'){
    h+=`<div class="card"><b>${esc(lt('zelftoetsT'))}</b><div class="mut" style="margin-top:4px">${esc(lt('zelftoetsD'))}</div></div><div class="row"><button class="btn" onclick="startLesToets()">${esc(lt('startToets'))}</button></div>`;
  }
  $('#lescontent').innerHTML=h;
}
function toggleLesModel(){
  const w=lesState.lesson.schrijven, box=$('#lesModel');
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML=`<div class="model-ar ar" style="white-space:pre-line">${esc(w.model_ar)}</div><div class="model-nl" style="white-space:pre-line" dir="auto">${esc(L(w.model))}</div>`;
}
/* generieke lesquiz (tweetalig; tik-Volgende bij fout + herhaal-de-foute) */
let lq=null;
function lqRun(questions,title){ lq={q:shuffle(questions.slice()),i:0,score:0,wrong:[],title:title}; lqDraw(); }
function lqDraw(){
  if(lq.i>=lq.q.length) return lqResult();
  const c=lq.q[lq.i]; const qt=L(c.q);
  let h=`<h2>${esc(lq.title)}</h2><div class="counter">${lq.i+1}/${lq.q.length} · score ${lq.score}</div><div class="progress"><i style="width:${lq.i/lq.q.length*100}%"></i></div>`;
  h+=`<div class="card"><div style="font-size:18px;font-weight:700;margin-bottom:8px" dir="auto">${esc(qt)}</div>`;
  c.opts.forEach((o,idx)=>{ const ot=L(o); h+=`<button class="opt" style="text-align:center" onclick="lqAns(${idx},${c.a})"><span dir="auto" style="font-size:${isAr(ot)?'22px':'16px'}">${esc(ot)}</span></button>`; });
  h+='<div id="lqVerdict"></div></div>';
  h+=`<div class="row" style="margin-top:8px"><button class="btn sec" onclick="lqBack()">${esc(lt('terug'))}</button></div>`;
  view.innerHTML=h;
}
function lqAns(chosen,correct){
  const c=lq.q[lq.i];
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,idx)=>{b.style.pointerEvents='none'; if(idx===correct)b.classList.add('good');});
  const ok=chosen===correct;
  if(ok) lq.score++; else { if(btns[chosen])btns[chosen].classList.add('bad'); lq.wrong.push(c); }
  __adv=()=>{lq.i++; lqDraw();};
  const okTxt = lang==='en'?'✓ Correct!':'✓ Goed!', noTxt = lang==='en'?'✗ Wrong':'✗ Fout', nextTxt = lang==='en'?'Next ▶':'Volgende ▶';
  $('#lqVerdict').innerHTML=`<div class="verdict ${ok?'ok':'no'}" style="margin-top:10px">${ok?okTxt:noTxt} <span class="mut" style="font-weight:400" dir="auto">${esc(L(c.u)||'')}</span></div>`+(ok?'':`<button class="btn" style="margin-top:10px" onclick="advNow()">${nextTxt}</button>`);
  if(ok) setTimeout(advNow,2100);
}
function lqResult(){
  const s=lq.score,t=lq.q.length,pct=Math.round(s/t*100),nw=lq.wrong.length;
  let h=`<h2>${esc(lq.title)} — ${esc(lt('klaar'))}</h2><div class="card"><div style="font-size:34px;font-weight:800;color:${pct>=80?'var(--acc)':pct>=55?'var(--gold)':'var(--red)'}">${s}/${t} · ${pct}%</div></div><div class="row">`+dagMarkLes();
  if(nw) h+=`<button class="btn gold" onclick="lqRun(lq.wrong.slice(),lq.title)">${esc(lt('herhaal'))} (${nw})</button>`;
  h+=`<button class="btn sec" onclick="lqBack()">${esc(lt('terughoofd'))}</button></div>`;
  view.innerHTML=h;
}
function lqBack(){ renderLesplan(lesState.lesson.id, lesState.section); }
function startLesQuiz(gi){ const g=lesState.lesson.grammatica[gi]; lqRun(g.quiz, L(g.titel)); }
function startLesRead(){ lqRun(lesState.lesson.lezen.vragen, L(lesState.lesson.lezen.titel)); }
function startLesUit(){ lqRun(lesState.lesson.uitspraak.quiz, lt('uitspraakT')); }
function startLesToets(){
  const l=lesState.lesson; let all=[];
  l.grammatica.forEach(g=>all=all.concat(g.quiz));
  all=all.concat(l.lezen.vragen).concat(l.uitspraak.quiz);
  lqRun(all, lt('zelftoetsTitle')+' · '+L(l.theme)); lq.isToets=true;
}
function startLesVocab(){
  const ws=lesState.lesson.woorden;
  const qs=ws.map(w=>{ const distract=shuffle(ws.filter(x=>x.ar!==w.ar)).slice(0,2).map(x=>x.ar); const opts=shuffle([w.ar].concat(distract)); return {q:(w[lang]||w.nl), opts:opts, a:opts.indexOf(w.ar), u:w.ar}; });
  lqRun(qs, lt('vocabT')+' · '+L(lesState.lesson.theme));
}

/* ---------- router ---------- */
function go(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='vandaag')return renderVandaag();
  if(tab==='voortgang')return renderVoortgang();
  if(tab==='plan')return renderPlan();
  if(tab==='lesplan')return renderLesplan();
  if(tab==='diag')return renderDiag();
  if(tab==='woorden')return renderWoorden();
  if(tab==='motor')return renderMotor();
  if(tab==='grammatica')return renderGram();
  if(tab==='vervoeg')return renderVervoeg();
  if(tab==='spelling')return renderSpelling();
  if(tab==='quiz')return renderQuizMenu();
  if(tab==='train')return renderTrain();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
// uitspraakknopjes (event-delegatie, want de app hertekent vaak)
document.addEventListener('click',function(e){ const b=e.target.closest&&e.target.closest('.spk'); if(b) speak(b.getAttribute('data-t')); });
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); }; }catch(e){} }
applyScale();
renderVandaag();
</script>
